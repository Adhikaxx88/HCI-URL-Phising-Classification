name: Sync to Hugging Face Spaces
on:
  push:
    branches: [main]
    paths: ['backend/**'] # Cuma jalan kalau lu ngutak-atik isi folder backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Perintah ini bakal motong folder 'backend' dan ngirim isinya ke HF
          git subtree push --prefix backend https://Adhikaxx88:$HF_TOKEN@huggingface.co/spaces/adhikaxx88/Phishing-Detection-Api main